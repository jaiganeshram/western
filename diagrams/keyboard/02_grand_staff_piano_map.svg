<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="bold">🎼 கிராண்ட் ஸ்டாஃப் &amp; பியானோ மேப்பிங் | Grand Staff &amp; Piano Notes</text>
  <text x="600" y="95" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="15">Treble Clef (𝄞 RH), Bass Clef (𝄢 LH), Ledger Lines and Middle C (C4) Connection</text>

  <!-- Grand Staff Lines Diagram -->
  <g transform="translate(100, 130)" filter="url(#shadow)">
    <!-- Background Card -->
    <rect width="1000" height="380" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>

    <!-- Left Brace & Bracket -->
    <path d="M 60 40 Q 40 190 60 340" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <line x1="60" y1="40" x2="60" y2="340" stroke="#fbbf24" stroke-width="3"/>

    <!-- Treble Staff (5 lines: y=50, 70, 90, 110, 130) -->
    <!-- Lines: E4 (130), G4 (110), B4 (90), D5 (70), F5 (50) -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1.8">
      <line x1="70" y1="50" x2="940" y2="50"/>
      <line x1="70" y1="70" x2="940" y2="70"/>
      <line x1="70" y1="90" x2="940" y2="90"/>
      <line x1="70" y1="110" x2="940" y2="110"/>
      <line x1="70" y1="130" x2="940" y2="130"/>
    </g>

    <!-- Treble Clef Symbol & Label -->
    <text x="95" y="115" fill="#38bdf8" font-size="70" font-family="serif">𝄞</text>
    <text x="180" y="95" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">Treble Clef (G-Clef)</text>
    <text x="180" y="118" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">வலது கை (Right Hand • Higher Pitches)</text>

    <!-- Notes on Treble Lines (E4, G4, B4, D5, F5) -->
    <!-- E4 -->
    <ellipse cx="440" cy="130" rx="9" ry="7" fill="#38bdf8"/>
    <text x="440" y="152" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">E4</text>

    <!-- G4 -->
    <ellipse cx="520" cy="110" rx="9" ry="7" fill="#38bdf8"/>
    <text x="520" y="105" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">G4</text>

    <!-- B4 -->
    <ellipse cx="600" cy="90" rx="9" ry="7" fill="#38bdf8"/>
    <text x="600" y="85" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">B4</text>

    <!-- D5 -->
    <ellipse cx="680" cy="70" rx="9" ry="7" fill="#38bdf8"/>
    <text x="680" y="65" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">D5</text>

    <!-- F5 -->
    <ellipse cx="760" cy="50" rx="9" ry="7" fill="#38bdf8"/>
    <text x="760" y="45" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">F5</text>

    <text x="600" y="165" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="12">கோடுகள் (Lines): Every Good Boy Does Fine (E - G - B - D - F) | இடைவெளிகள் (Spaces): F - A - C - E</text>

    <!-- MIDDLE C (C4) LEDGER LINE (y=190) -->
    <line x1="450" y1="190" x2="550" y2="190" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6,4"/>
    <ellipse cx="500" cy="190" rx="12" ry="9" fill="#fbbf24"/>
    <text x="500" y="215" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="16" font-weight="900">👑 Middle C (C4)</text>

    <!-- Bass Staff (5 lines: y=250, 270, 290, 310, 330) -->
    <!-- Lines: G2 (330), B2 (310), D3 (290), F3 (270), A3 (250) -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1.8">
      <line x1="70" y1="250" x2="940" y2="250"/>
      <line x1="70" y1="270" x2="940" y2="270"/>
      <line x1="70" y1="290" x2="940" y2="290"/>
      <line x1="70" y1="310" x2="940" y2="310"/>
      <line x1="70" y1="330" x2="940" y2="330"/>
    </g>

    <!-- Bass Clef Symbol & Label -->
    <text x="95" y="300" fill="#a855f7" font-size="60" font-family="serif">𝄢</text>
    <text x="180" y="285" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">Bass Clef (F-Clef)</text>
    <text x="180" y="308" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="13">இடது கை (Left Hand • Lower Pitches)</text>

    <!-- Notes on Bass Lines (G2, B2, D3, F3, A3) -->
    <!-- G2 -->
    <ellipse cx="440" cy="330" rx="9" ry="7" fill="#a855f7"/>
    <text x="440" y="352" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">G2</text>

    <!-- B2 -->
    <ellipse cx="520" cy="310" rx="9" ry="7" fill="#a855f7"/>
    <text x="520" y="305" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">B2</text>

    <!-- D3 -->
    <ellipse cx="600" cy="290" rx="9" ry="7" fill="#a855f7"/>
    <text x="600" y="285" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">D3</text>

    <!-- F3 -->
    <ellipse cx="680" cy="270" rx="9" ry="7" fill="#a855f7"/>
    <text x="680" y="265" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">F3</text>

    <!-- A3 -->
    <ellipse cx="760" cy="250" rx="9" ry="7" fill="#a855f7"/>
    <text x="760" y="245" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">A3</text>

    <text x="600" y="365" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="12">கோடுகள் (Lines): Good Boys Do Fine Always (G - B - D - F - A) | இடைவெளிகள் (Spaces): All Cows Eat Grass (A - C - E - G)</text>
  </g>

  <!-- Bottom Explanatory Strip -->
  <g transform="translate(100, 530)">
    <rect width="1000" height="110" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="30" y="35" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">💡 பியானோ வாசிப்பாளர் நினைவில் கொள்ள வேண்டிய முக்கிய விதிகள்:</text>
    <text x="30" y="65" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">1. வலது கை நோட்டுகள் பொதுவாக ட்ரெபிள் க்ளெஃப்பிலும் (𝄞), இடது கை நோட்டுகள் பேஸ் க்ளெஃப்பிலும் (𝄢) எழுதப்படும்.</text>
    <text x="30" y="90" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">2. Middle C இரண்டு க்ளெஃப்களுக்கும் நடுவே தனி லெட்ஜர் லைனில் (Ledger line) அமர்ந்து இரண்டையும் இணைக்கிறது.</text>
  </g>
</svg>
