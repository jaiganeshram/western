<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#141e3a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad4)"/>
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="26" font-weight="bold">🎹 யமஹா PSR-I510 &amp; PSR விசைப்பலகை கர்நாடக இசை அமைப்பு வழிகாட்டி</text>
  <text x="600" y="95" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="15">Yamaha PSR-I510 / PSR Series Essential Settings for Carnatic Classical Performance</text>

  <!-- 4 Setup Cards -->
  <g transform="translate(60, 130)">
    <!-- Card 1: Pitch Bend Wheel -->
    <rect x="0" y="0" width="250" height="480" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#0284c7"/>
    <text x="125" y="27" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">1. பிட்ச் பெண்ட் வீல் (Gamakas)</text>
    
    <text x="20" y="75" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="14" font-weight="bold">கமகங்களுக்கான வரம்பு:</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">FUNCTION ➔ PITCH BEND</text>
    <text x="20" y="130" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">Range = 02 (±2 Semitones)</text>
    <text x="20" y="160" fill="#94a3b8" font-family="'Noto Sans Tamil', sans-serif" font-size="11" line-height="1.6">
      <tspan x="20" dy="0">இது 1 முழு சுரம் (Whole Tone)</tspan>
      <tspan x="20" dy="20">அலைவு தரும். கம்பிகம், ஜாரு,</tspan>
      <tspan x="20" dy="20">நோக்கு கமகங்களுக்கு மிகத்</tspan>
      <tspan x="20" dy="20">துல்லியமான நெகிழ்வு தரும்.</tspan>
    </text>

    <rect x="20" y="270" width="210" height="80" rx="8" fill="rgba(6,182,212,0.1)" stroke="#0284c7" stroke-width="1"/>
    <text x="125" y="300" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Wheel Manipulation</text>
    <text x="125" y="325" text-anchor="middle" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="11">இடது கையால் வீல் இயக்கம்</text>
    <text x="125" y="342" text-anchor="middle" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">வலது கையால் கட்டை மீட்டல்</text>
  </g>

  <g transform="translate(340, 130)">
    <!-- Card 2: Transpose / Kattai -->
    <rect x="0" y="0" width="250" height="480" rx="12" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#d97706"/>
    <text x="125" y="27" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">2. டிரான்ஸ்போஸ் (கட்டை சுருதி)</text>

    <text x="20" y="75" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="14" font-weight="bold">பாடகர் சுருதிக்கேற்ப மாற்றம்:</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">TRANSPOSE பட்டன்:</text>
    
    <text x="20" y="140" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• C  ➔ 1 கட்டை (Default: 0)</text>
    <text x="20" y="165" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• C# ➔ 1½ கட்டை (+1)</text>
    <text x="20" y="190" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• D  ➔ 2 கட்டை (+2)</text>
    <text x="20" y="215" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• D# ➔ 2½ கட்டை (+3)</text>
    <text x="20" y="240" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• G  ➔ 5 கட்டை (+7)</text>
    <text x="20" y="265" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">• G# ➔ 5½ கட்டை (+8 / -4)</text>

    <rect x="20" y="300" width="210" height="150" rx="8" fill="rgba(245,158,11,0.1)" stroke="#d97706" stroke-width="1"/>
    <text x="35" y="328" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="12" font-weight="bold">💡 சிறப்புப் பலன்:</text>
    <text x="35" y="352" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">எப்போதும் வெள்ளை C4</text>
    <text x="35" y="372" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">கட்டையையே ஸ-வாக வாசிக்கலாம்.</text>
    <text x="35" y="392" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">Transpose மாற்றுவதன் மூலம்</text>
    <text x="35" y="412" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">எந்தப் பாடகர் சுருதிக்கும்</text>
    <text x="35" y="432" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">ஒரே விரல் அமைப்பில் வாசிக்கலாம்!</text>
  </g>

  <g transform="translate(620, 130)">
    <!-- Card 3: Voices & Dual Layer -->
    <rect x="0" y="0" width="250" height="480" rx="12" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="42" rx="12" fill="#059669"/>
    <text x="125" y="27" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">3. இந்தியக் குரல்கள் (Indian Voices)</text>

    <text x="20" y="75" fill="#34d399" font-family="'Noto Sans Tamil', sans-serif" font-size="14" font-weight="bold">PSR-I510 சிறந்த தேர்வுகள்:</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">• இந்திய புல்லாங்குழல் (Bansuri)</text>
    <text x="20" y="130" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">• ஹார்மோனியம் (Harmonium)</text>
    <text x="20" y="155" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">• சரஸ்வதி வீணை (Veena)</text>
    <text x="20" y="180" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">• நாதஸ்வரம் (Nadaswaram)</text>

    <rect x="20" y="220" width="210" height="230" rx="8" fill="rgba(16,185,129,0.1)" stroke="#059669" stroke-width="1"/>
    <text x="35" y="248" fill="#34d399" font-family="'Noto Sans Tamil', sans-serif" font-size="12" font-weight="bold">DUAL VOICE (இரட்டை அடுக்கு):</text>
    <text x="35" y="275" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">• முதன்மை Voice 1: Bansuri</text>
    <text x="35" y="295" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">• அடுக்கு Voice 2: Tanpura</text>
    <text x="35" y="325" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="bold">TOUCH RESPONSE (தொடு உணர்வு):</text>
    <text x="35" y="348" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">• Soft 1 அல்லது Soft 2 ஆக</text>
    <text x="35" y="368" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">வைத்தால், லேசாகத் தொட்டாலும்</text>
    <text x="35" y="388" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">முழு நாதமும் தூய்மையாக</text>
    <text x="35" y="408" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">மங்காமல் ஒலிக்கும்.</text>
  </g>

  <g transform="translate(900, 130)">
    <!-- Card 4: Web MIDI & USB -->
    <rect x="0" y="0" width="240" height="480" rx="12" fill="url(#panelGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="42" rx="12" fill="#7e22ce"/>
    <text x="120" y="27" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">4. USB &amp; Web MIDI இணைப்பு</text>

    <text x="20" y="75" fill="#e879f9" font-family="'Noto Sans Tamil', sans-serif" font-size="14" font-weight="bold">நேரடி கணினி இணைப்பு:</text>
    <text x="20" y="105" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="12">USB Type-B கேபிள் மூலம்</text>
    <text x="20" y="125" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">விசைப்பலகையை லேப்டாப்பில்</text>
    <text x="20" y="145" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">இணைக்கவும்.</text>

    <rect x="20" y="175" width="200" height="120" rx="8" fill="rgba(192,132,252,0.1)" stroke="#7e22ce" stroke-width="1"/>
    <text x="35" y="202" fill="#e879f9" font-family="'Noto Sans Tamil', sans-serif" font-size="12" font-weight="bold">🌐 இந்த செயலியின் அற்புதம்:</text>
    <text x="35" y="225" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">Web MIDI தானாக உங்கள்</text>
    <text x="35" y="245" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">Yamaha விசைப்பலகையை</text>
    <text x="35" y="265" fill="#cbd5e1" font-family="'Noto Sans Tamil', sans-serif" font-size="11">அடையாளம் கண்டு கொள்ளும்!</text>

    <text x="20" y="325" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="11">நீங்கள் யமஹா விசைப்பலகையில்</text>
    <text x="20" y="345" fill="#e2e8f0" font-family="'Noto Sans Tamil', sans-serif" font-size="11">ஒவ்வொரு கட்டையைத் தொடும்போதும்</text>
    <text x="20" y="365" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="bold">திரையில் அந்தக் கட்டை மின்னும்,</text>
    <text x="20" y="385" fill="#fbbf24" font-family="'Noto Sans Tamil', sans-serif" font-size="11" font-weight="bold">ஸ்வரம் பச்சை நிறத்தில் உறுதிசெய்யப்படும்!</text>
  </g>
</svg>
