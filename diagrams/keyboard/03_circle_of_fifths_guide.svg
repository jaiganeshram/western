<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="55" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="bold">🌀 சர்க்கிள் ஆஃப் பிஃப்த்ஸ் | The Circle of Fifths</text>
  <text x="600" y="85" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="15">12 Major Keys, Relative Minor Keys and Key Signatures (Sharps ♯ &amp; Flats ♭)</text>

  <!-- Circle Center: cx=420, cy=360 -->
  <g transform="translate(60, 20)">
    <!-- Concentric Rings -->
    <circle cx="360" cy="340" r="230" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="1.5"/>
    <circle cx="360" cy="340" r="180" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2"/>
    <circle cx="360" cy="340" r="120" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <circle cx="360" cy="340" r="60" fill="rgba(10, 14, 28, 0.95)" stroke="#fbbf24" stroke-width="2"/>

    <!-- Center Label -->
    <text x="360" y="335" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">Circle of</text>
    <text x="360" y="355" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="16" font-weight="900">FIFTHS</text>

    <!-- 12 Major Positions (Outer ring: r=150) & Relative Minors (Inner ring: r=90) -->
    <!-- 12 o'clock: C Major / Am (0) -->
    <g transform="translate(360, 190)">
      <circle cx="0" cy="0" r="22" fill="#fbbf24"/>
      <text x="0" y="7" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="18" font-weight="900">C</text>
      <text x="0" y="42" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">Am</text>
      <text x="0" y="-30" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="12">0 ♯ / 0 ♭</text>
    </g>

    <!-- 1 o'clock: G Major / Em (1 #) (angle 30 deg: dx = 150*sin30 = 75, dy = -150*cos30 = -130 -> cx=435, cy=210) -->
    <g transform="translate(435, 210)">
      <circle cx="0" cy="0" r="20" fill="#38bdf8"/>
      <text x="0" y="6" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">G</text>
      <text x="-15" y="32" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Em</text>
      <text x="25" y="-15" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="11">1 ♯ (F#)</text>
    </g>

    <!-- 2 o'clock: D Major / Bm (2 #) (angle 60 deg: dx = 130, dy = -75 -> cx=490, cy=265) -->
    <g transform="translate(490, 265)">
      <circle cx="0" cy="0" r="20" fill="#38bdf8"/>
      <text x="0" y="6" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">D</text>
      <text x="-25" y="15" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Bm</text>
      <text x="32" y="-5" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="11">2 ♯</text>
    </g>

    <!-- 3 o'clock: A Major / F#m (3 #) (angle 90 deg: cx=510, cy=340) -->
    <g transform="translate(510, 340)">
      <circle cx="0" cy="0" r="20" fill="#38bdf8"/>
      <text x="0" y="6" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">A</text>
      <text x="-32" y="5" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">F#m</text>
      <text x="35" y="5" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="11">3 ♯</text>
    </g>

    <!-- 4 o'clock: E Major / C#m (4 #) (angle 120 deg: cx=490, cy=415) -->
    <g transform="translate(490, 415)">
      <circle cx="0" cy="0" r="20" fill="#38bdf8"/>
      <text x="0" y="6" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">E</text>
      <text x="-25" y="-10" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">C#m</text>
      <text x="32" y="15" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="11">4 ♯</text>
    </g>

    <!-- 5 o'clock: B Major / G#m (5 #) (angle 150 deg: cx=435, cy=470) -->
    <g transform="translate(435, 470)">
      <circle cx="0" cy="0" r="20" fill="#38bdf8"/>
      <text x="0" y="6" text-anchor="middle" fill="#070a14" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">B</text>
      <text x="-15" y="-28" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">G#m</text>
      <text x="25" y="25" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="11">5 ♯</text>
    </g>

    <!-- 6 o'clock: F# / Gb (6 # / 6 b) (angle 180 deg: cx=360, cy=490) -->
    <g transform="translate(360, 490)">
      <circle cx="0" cy="0" r="22" fill="#a855f7"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="14" font-weight="800">F#/Gb</text>
      <text x="0" y="-35" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">D#m/Ebm</text>
      <text x="0" y="35" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-size="11">6 ♯ / 6 ♭</text>
    </g>

    <!-- 7 o'clock: Db / C# (5 b) (cx=285, cy=470) -->
    <g transform="translate(285, 470)">
      <circle cx="0" cy="0" r="20" fill="#f43f5e"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="15" font-weight="800">Db</text>
      <text x="15" y="-28" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Bbm</text>
      <text x="-25" y="25" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11">5 ♭</text>
    </g>

    <!-- 8 o'clock: Ab Major (4 b) (cx=230, cy=415) -->
    <g transform="translate(230, 415)">
      <circle cx="0" cy="0" r="20" fill="#f43f5e"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="15" font-weight="800">Ab</text>
      <text x="25" y="-10" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Fm</text>
      <text x="-32" y="15" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11">4 ♭</text>
    </g>

    <!-- 9 o'clock: Eb Major (3 b) (cx=210, cy=340) -->
    <g transform="translate(210, 340)">
      <circle cx="0" cy="0" r="20" fill="#f43f5e"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="15" font-weight="800">Eb</text>
      <text x="32" y="5" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Cm</text>
      <text x="-35" y="5" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11">3 ♭</text>
    </g>

    <!-- 10 o'clock: Bb Major (2 b) (cx=230, cy=265) -->
    <g transform="translate(230, 265)">
      <circle cx="0" cy="0" r="20" fill="#f43f5e"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="15" font-weight="800">Bb</text>
      <text x="25" y="15" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Gm</text>
      <text x="-32" y="-5" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11">2 ♭</text>
    </g>

    <!-- 11 o'clock: F Major (1 b) (cx=285, cy=210) -->
    <g transform="translate(285, 210)">
      <circle cx="0" cy="0" r="20" fill="#f43f5e"/>
      <text x="0" y="6" text-anchor="middle" fill="#fff" font-family="'Outfit', sans-serif" font-size="16" font-weight="800">F</text>
      <text x="15" y="32" text-anchor="middle" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="12">Dm</text>
      <text x="-25" y="-15" text-anchor="middle" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="11">1 ♭ (Bb)</text>
    </g>
  </g>

  <!-- Side Theory Panel -->
  <g transform="translate(730, 120)">
    <rect width="420" height="500" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
    
    <text x="25" y="40" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold">📚 எப்படி இந்த சக்கரத்தைப் பயன்படுத்துவது?</text>

    <!-- Point 1 -->
    <text x="25" y="80" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">1. கடிகாரச் சுழற்சி (Clockwise = +5th):</text>
    <text x="25" y="105" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">ஒவ்வொரு படியும் 5-வது நோட்டுக்கு (Fifth) தாவும்.</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">ஒவ்வொரு நகர்விலும் ஒரு Sharp (♯) கூடும்:</text>
    <text x="25" y="148" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">F - C - G - D - A - E - B (Order of Sharps)</text>

    <!-- Point 2 -->
    <text x="25" y="195" fill="#f43f5e" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">2. எதிர்கடிகாரச் சுழற்சி (Counter-Clockwise = +4th):</text>
    <text x="25" y="220" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">ஒவ்வொரு படியும் 4-வது நோட்டுக்கு (Fourth) தாவும்.</text>
    <text x="25" y="240" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">ஒவ்வொரு நகர்விலும் ஒரு Flat (♭) கூடும்:</text>
    <text x="25" y="263" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">B - E - A - D - G - C - F (Order of Flats)</text>

    <!-- Point 3 -->
    <text x="25" y="310" fill="#a5b4fc" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">3. ரிலேட்டிவ் மைனர் (Relative Minor):</text>
    <text x="25" y="335" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">ஒவ்வொரு மேஜர் கீக்கும் உட்புற வட்டத்தில் உள்ள மைனர் கீ</text>
    <text x="25" y="355" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">அதே Key Signature-ஐ பகிர்ந்து கொள்ளும் (C Maj = A min).</text>

    <!-- Point 4 -->
    <text x="25" y="400" fill="#34d399" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold">4. கார்ட் அமைக்கும் மந்திரம் (I - IV - V):</text>
    <text x="25" y="425" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">எந்த ஒரு கீயைத் தேர்ந்தெடுத்தாலும், அதன் இடதுபுறம் IV-ம்,</text>
    <text x="25" y="445" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">வலதுபுறம் V-ம் உடனடியாக அமைந்திருக்கும்!</text>
    <text x="25" y="470" fill="#34d399" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">உதாரணம்: C மையமெனில், இடது F (IV), வலது G (V).</text>
  </g>
</svg>
