<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="whiteKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="whiteKeyMidCGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="85%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="blackKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="640" rx="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', -apple-system, sans-serif" font-size="28" font-weight="bold">🎹 மேற்கத்திய விசைப்பலகை 12 ஸ்வர வரைபடம் | Western Keyboard Note Map</text>
  <text x="600" y="95" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', -apple-system, sans-serif" font-size="15">Middle C (C4 = 261.63 Hz), 12 Semitones, Sharps (♯) &amp; Flats (♭) and Solfege (Do Re Mi Fa Sol La Ti)</text>

  <!-- Piano Bed: 2 Octaves (C3 to C5) -->
  <!-- 15 White Keys: C3, D3, E3, F3, G3, A3, B3, C4(Middle C), D4, E4, F4, G4, A4, B4, C5 -->
  <!-- Key width: 70px each = 1050px total -->
  <g transform="translate(75, 130)" filter="url(#shadow)">
    <!-- White Keys -->
    <!-- Octave 3 (C3 to B3) -->
    <rect x="0" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="70" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="140" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="210" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="280" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="350" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="420" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Middle C4 (Special Gold Highlight) -->
    <rect x="490" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyMidCGrad)" stroke="#d97706" stroke-width="2.5"/>

    <!-- Octave 4 (D4 to B4) & C5 -->
    <rect x="560" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="630" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="700" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="770" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="840" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="910" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="980" y="0" width="70" height="340" rx="5" fill="url(#whiteKeyGrad)" stroke="#64748b" stroke-width="1.5"/>

    <!-- Black Keys (Width 42px, Height 210px) -->
    <!-- Octave 3 Black Keys -->
    <rect x="49" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="119" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="259" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="329" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="399" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Octave 4 Black Keys -->
    <rect x="539" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="609" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="749" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="819" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="889" y="0" width="42" height="210" rx="4" fill="url(#blackKeyGrad)" stroke="#0f172a" stroke-width="1.5"/>

    <!-- White Key Labels -->
    <!-- Octave 3 -->
    <text x="35" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">C3</text>
    <text x="35" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Do</text>

    <text x="105" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">D3</text>
    <text x="105" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Re</text>

    <text x="175" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">E3</text>
    <text x="175" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Mi</text>

    <text x="245" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">F3</text>
    <text x="245" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Fa</text>

    <text x="315" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">G3</text>
    <text x="315" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Sol</text>

    <text x="385" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">A3</text>
    <text x="385" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">La</text>

    <text x="455" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">B3</text>
    <text x="455" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Ti</text>

    <!-- Middle C4 Special Labels -->
    <text x="525" y="275" text-anchor="middle" fill="#b45309" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">👑</text>
    <text x="525" y="300" text-anchor="middle" fill="#78350f" font-family="'Outfit', sans-serif" font-size="22" font-weight="900">C4</text>
    <text x="525" y="325" text-anchor="middle" fill="#92400e" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold">Middle C</text>

    <!-- Octave 4 -->
    <text x="595" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">D4</text>
    <text x="595" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Re</text>

    <text x="665" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">E4</text>
    <text x="665" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Mi</text>

    <text x="735" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">F4</text>
    <text x="735" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Fa</text>

    <text x="805" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">G4</text>
    <text x="805" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Sol</text>

    <text x="875" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">A4</text>
    <text x="875" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">La (440Hz)</text>

    <text x="945" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">B4</text>
    <text x="945" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Ti</text>

    <text x="1015" y="300" text-anchor="middle" fill="#0f172a" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">C5</text>
    <text x="1015" y="325" text-anchor="middle" fill="#64748b" font-family="'Outfit', sans-serif" font-size="12">Do</text>

    <!-- Black Key Labels -->
    <text x="70" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">C#3</text>
    <text x="70" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Db3</text>

    <text x="140" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">D#3</text>
    <text x="140" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Eb3</text>

    <text x="280" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">F#3</text>
    <text x="280" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Gb3</text>

    <text x="350" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">G#3</text>
    <text x="350" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Ab3</text>

    <text x="420" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">A#3</text>
    <text x="420" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Bb3</text>

    <!-- Octave 4 Black Keys -->
    <text x="560" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">C#4</text>
    <text x="560" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Db4</text>

    <text x="630" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">D#4</text>
    <text x="630" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Eb4</text>

    <text x="770" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">F#4</text>
    <text x="770" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Gb4</text>

    <text x="840" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">G#4</text>
    <text x="840" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Ab4</text>

    <text x="910" y="160" text-anchor="middle" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="13" font-weight="bold">A#4</text>
    <text x="910" y="185" text-anchor="middle" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="11">Bb4</text>
  </g>

  <!-- Legend & Bottom Guide -->
  <g transform="translate(80, 500)">
    <rect width="1040" height="135" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Column 1: Middle C & Octaves -->
    <text x="30" y="32" fill="#fbbf24" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">👑 Middle C (C4) முக்கியத்துவம்</text>
    <text x="30" y="58" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• 61 மற்றும் 88-கீ போர்டுகளின் மையப்புள்ளி</text>
    <text x="30" y="80" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• வலது கை (Right Hand) ட்ரெபிள் க்ளெஃப் தொடக்கம்</text>
    <text x="30" y="102" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• இடது கை (Left Hand) பேஸ் க்ளெஃப் முடிவு புள்ளி</text>

    <!-- Column 2: Sharps & Flats -->
    <text x="380" y="32" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">♯ Sharps &amp; ♭ Flats (கருப்பு விசைகள்)</text>
    <text x="380" y="58" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• Sharp (♯) = அரைக் கட்டை மேலே (Half Step Up)</text>
    <text x="380" y="80" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• Flat (♭) = அரைக் கட்டை கீழே (Half Step Down)</text>
    <text x="380" y="102" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• Enharmonic: C# மற்றும் Db ஒரே ஒலியைத் தரும்</text>

    <!-- Column 3: Hand Numbers -->
    <text x="730" y="32" fill="#34d399" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold">🖐️ விரல் எண்கள் (Finger Numbering)</text>
    <text x="730" y="58" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• 1 = பெருவிரல் (Thumb)</text>
    <text x="730" y="80" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• 2 = சுட்டுவிரல் | 3 = நடுவிரல்</text>
    <text x="730" y="102" fill="#cbd5e1" font-family="'Outfit', sans-serif" font-size="13">• 4 = மோதிரவிரல் | 5 = சிறுவிரல் (Pinky)</text>
  </g>
</svg>
